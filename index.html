<style>

</div>
<nav id="nav"></nav><div id="v"></div>
</div></main>
<script>

S.pistols.forEach(ensureTracks);
var cloudUser=null, cloudReady=false, cloudSaving=false;

  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

    clearTimeout(window.__cloudSaveTimer);

      if(cloudSaving)return;

        var result=await window.sb.from('skytte_data').upsert(

  }
}
function baseTime(m,d){var q=T().timeSettings[m],a=PROFILES[q.preset]||PROFILES.medel,idx=D.indexOf(d);return Math.max(0.5,a[idx]+(Number(q.adjust[d])||0))}

   D.forEach(function(d){[1,2].forEach(function(m){

}

 var I=info(),c=I.c,miss=0,pts=0,x=0;

var historyLimit=10,historyStyle='all',historyPistol='all',historyDistance='all',historyType='all',historySelectedIndex=-1;
function setHistoryFilter(kind,value){if(kind==='limit')historyLimit=Number(value)||10;else if(kind==='style')historyStyle=value;else if(kind==='pistol')historyPistol=value;else if(kind==='distance')historyDistance=value;else if(kind==='type')historyType=value;historySelectedIndex=-1;render()}

function deleteHistorySeries(pidValue,trackValue,logIndex){
 if(!confirm('Ta bort den här träningsserien? Åtgärden kan inte ångras.'))return;
 var p=S.pistols.filter(function(x){return x.id===pidValue})[0];
 if(!p||!p.tracks||!p.tracks[trackValue]||!p.tracks[trackValue].log)return;

}

 if(!confirm('Ta bort det här testresultatet? Åtgärden kan inte ångras.'))return;
 var p=S.pistols.filter(function(x){return x.id===pidValue})[0];
 if(!p||!p.tracks||!p.tracks[trackValue]||!p.tracks[trackValue].tests)return;

}

function deleteAllTrainingSeries(){
 var count=0,seriesCount=0,testCount=0;

 [112,94,76,58,40,22].forEach(function(r,i){svg+='<circle cx="160" cy="160" r="'+r+'" fill="'+(i%2===0?'#fff':'#202820')+'" stroke="#59645b" stroke-width="1.2"/>'});
 svg+='<circle cx="160" cy="160" r="10" fill="none" stroke="#c53c32" stroke-width="1.5"/>';
 for(var i=0;i<positions.length;i++){var p=positions[i];if(!p)continue;var score=shots[i]||'',fill=score==='Bom'?'#d64535':score==='X'?'#e5a900':'#1672b8';svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="5.5" fill="'+fill+'" stroke="#17251d" stroke-width="1"/>';if(e._showNumbers)svg+='<text x="'+p.x+'" y="'+(p.y-8)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#17251d">'+(i+1)+'</text>'}
 return svg+'</svg>';

function historyStyleName(k){return k==='support'?'Med stödhand':'Utan stödhand'}

function statsMarkup(){
 var logs=[],tests=[];
 S.pistols.forEach(function(p){ensureTracks(p);['support','unsupported'].forEach(function(k){
  p.tracks[k].log.forEach(function(e,i){logs.push(Object.assign({pistol:p.name,hand:k,_pid:p.id,_logIndex:i},e))});

 var avg=shotsN?points/shotsN:0,rate=total?100*passed/total:0;
 var h='<div class="card"><h2>Din progression</h2><div class="mu">Statistiken bygger på sparade träningsserier från alla dina pistoler och båda träningssätten.</div>';
 if(!total){h+='<p style="margin:12px 0 4px">Här visas din utveckling när du har sparat träningsserier. Börja med att genomföra några serier under Träna.</p></div>';}
 else{
  h+='<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px">';

  h+='</div><div class="mu" style="margin-top:8px">'+passed+' av '+total+' serier godkända · '+shotsN+' registrerade skott totalt.</div></div>';
  var weeks={};logs.forEach(function(e){var d=new Date(e.t),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);var key=d.toISOString().slice(0,10);if(!weeks[key])weeks[key]={pts:0,n:0};weeks[key].pts+=Number(e.pts)||0;weeks[key].n+=(e.shots||[]).length});
  var wk=Object.keys(weeks).sort().slice(-8);
  h+='<div class="card"><h2>Utveckling vecka för vecka</h2><div class="mu">Genomsnittlig poäng per skott. Visar de senaste åtta veckorna med registrerad träning.</div>';
  if(wk.length<2)h+='<p class="mu">Spara serier under fler veckor för att se en tydligare trend.</p>';

function targetLimits(score){
 // Ringarnas faktiska radier. Poängen avgörs av träffmarkörens ytterkant.
 if(score==='Bom')return{min:112,max:226};
 if(score==='5')return{min:94,max:112};
 if(score==='6')return{min:76,max:94};
 if(score==='7')return{min:58,max:76};
 if(score==='8')return{min:40,max:58};
 if(score==='9')return{min:22,max:40};
 if(score==='10')return{min:10,max:22};

}
function constrainTargetPoint(p,score){
 var lim=targetLimits(score),dx=p.x-160,dy=p.y-160,rad=Math.sqrt(dx*dx+dy*dy),angle=Math.atan2(dy,dx);
 // Markörens radie är 4,5. En träff får tangera poängringens
 // ytterlinje, men får inte tangera ringen med högre poäng.
 var markerRadius=4.5,min,max;
 if(score==='Bom'){
  min=lim.min+markerRadius;
  max=lim.max-markerRadius;
 }else if(score==='X'){
  min=0;
  // X-träff får ligga i 10-ringen om markörens ytterkant tangerar X-cirkeln.
  max=lim.max+markerRadius;
 }else{
  min=lim.min+markerRadius;
  max=lim.max+markerRadius;
 }
 if(max<min){var mid=(min+max)/2;min=mid;max=mid;}
 rad=Math.max(min,Math.min(max,rad));
 return{x:Math.max(0,Math.min(320,160+Math.cos(angle)*rad)),y:Math.max(0,Math.min(320,160+Math.sin(angle)*rad))};
}

    var r=await window.sb.from('skytte_data').select('data').eq('user_id',user.id).maybeSingle();
    if(r.error)throw r.error;
    if(r.data && r.data.data && r.data.data.pistols){
      S=r.data.data;
    }else{
      // Första inloggningen: flytta med eventuell befintlig lokal träningsdata.
      var local=load();
      S=local;
      var w=await window.sb.from('skytte_data').upsert(
        {user_id:user.id,data:S,updated_at:new Date().toISOString()},
        {onConflict:'user_id'}
      );
      if(w.error)throw w.error;
    }
    if(S.version!==2){S.pistols.forEach(function(p){p.tracks={support:{cells:{},log:[],tests:[]},unsupported:{cells:{},log:[],tests:[]}};p.cells={};p.log=[];p.tests=[]});S.version=2;}
    S.pistols.forEach(ensureTracks);
    pid=S.pistols[0].id;
    cur=null;msg='';
    cloudReady=true;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    showApp();render();setSync('Molnsynk aktiv ✓');
  }catch(e){
    cloudReady=false;
    showAuth('Kunde inte läsa molndata: '+(e.message||e));
  }
}
async function logout(){
  cloudReady=false;cloudUser=null;
  if(window.sb)await window.sb.auth.signOut();
  showApp();setSync('Lokal lagring – molnsynk av');
}
(function initCloud(){
  // Visa alltid inloggningsformuläret och träningsappen. Användaren väljer själv.
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='block';
  setSync('Lokal lagring – du kan logga in för molnsynk');
  try{
    if(!window.supabase || SUPABASE_URL.indexOf('https://')!==0 || SUPABASE_ANON_KEY.indexOf('KLIStra_')===0){
      document.getElementById('authmsg').textContent='Molnsynk är inte konfigurerad. Du kan fortsätta utan konto.';
      return;
    }
    window.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    window.sb.auth.getSession().then(function(r){
      if(r.data.session)startCloud(r.data.session.user);
      else {document.getElementById('authmsg').textContent='Logga in eller skapa konto för molnsynk. Du kan också fortsätta utan konto.';}
    }).catch(function(e){document.getElementById('authmsg').textContent='Molnsynk kunde inte ansluta. Du kan fortsätta utan konto.';});
    window.sb.auth.onAuthStateChange(function(event,session){
      if(event==='SIGNED_OUT'){cloudReady=false;cloudUser=null;showApp();setSync('Lokal lagring – molnsynk av')}
    });
  }catch(e){
    document.getElementById('authmsg').textContent='Molnsynk otillgänglig. Du kan fortsätta utan konto.';
    setSync('Lokal lagring – molnsynk otillgänglig');
    console.warn('Molnsynk kunde inte startas:',e);
  }
})();
</script></body></html>
