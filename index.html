<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snabbskytte – träning (molnversion)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#e8ebe3;--sf:#f7f8f4;--ink:#16241c;--mu:#5d6b61;--ln:#c5cbbd;--ac:#1f5c3f;--hi:#e0a800;--bad:#a63d2f;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--sf:#1e2822;--ink:#e6ebe3;--mu:#98a89d;--ln:#34423a;--ac:#5cc08a;--hi:#f0bd2a;--bad:#e8806f;--on:#0d1a12}}
:root[data-theme="dark"]{--bg:#141b17;--sf:#1e2822;--ink:#e6ebe3;--mu:#98a89d;--ln:#34423a;--ac:#5cc08a;--hi:#f0bd2a;--bad:#e8806f;--on:#0d1a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;font:600 15px Barlow,sans-serif}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font:700 54px/1 'Barlow Condensed',sans-serif}
.big small{font-size:22px;color:var(--mu);font-weight:500}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;align-items:center;gap:6px;margin:6px 0}
.row b{width:22px;color:var(--mu);font-weight:600}
.row button{flex:1;padding:11px 0;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:7px;font:600 16px Barlow,sans-serif}
.row button.s{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row button.s.bom{background:var(--bad);border-color:var(--bad);color:#fff}
.go{width:100%;padding:14px;border:0;border-radius:8px;background:var(--hi);color:#1a1400;font:700 18px Barlow,sans-serif;margin-top:8px}
.go:disabled{opacity:.4}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
td.r{text-align:right}
.level-toggle{font:600 11px Barlow,sans-serif;padding:2px 7px;margin-top:3px;border:1px solid #b7d6bd;border-radius:5px;background:#e5f2e7;color:#245b32;min-width:34px}.level-toggle.off{border-color:#e7c0c0;background:#f8e8e8;color:#914343}
select,input,textarea{font:16px Barlow,sans-serif;padding:9px;border:1px solid var(--ln);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
.btn{padding:10px 12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:7px;font:600 15px Barlow,sans-serif;margin:3px 3px 3px 0}
.msg{padding:8px 10px;border-left:4px solid var(--ac);background:var(--bg);margin-bottom:10px;border-radius:4px}
h2{font:700 22px 'Barlow Condensed',sans-serif;margin:0 0 8px}
</style></head><body><main>
<section id="auth" class="card">
  <h2>Logga in till Snabbskytte</h2>
  <p class="mu">Dina träningsresultat sparas på ditt privata konto och kan användas på flera enheter.</p>
  <label for="email">E-post</label>
  <input id="email" type="email" autocomplete="username" placeholder="namn@example.com">
  <label for="password">Lösenord</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Minst 8 tecken">
  <button class="go" onclick="authAction('login')">Logga in</button>
  <button class="btn" onclick="authAction('signup')">Skapa konto</button>
  <button class="btn" style="margin-top:8px" onclick="continueOffline()">Fortsätt utan konto</button>
  <div id="authmsg" class="mu" style="margin-top:8px">Logga in för molnsynk, eller fortsätt utan konto.</div>
</section>
<div id="app">
<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:0 0 8px">
  <span id="syncstatus" class="mu">Lokal lagring</span>
  <button class="btn" id="accountbtn" style="margin:0;background:var(--sf);border-color:var(--ac);color:var(--ac);font-weight:700" onclick="openLogin()">LOGGA IN / SKAPA KONTO</button>
</div>
<nav id="nav"></nav><div id="v"></div>
</div></main>
<script>
var D=[3,7,15,25,50],Z=['Bom','7','8','9','10','X'],KEY='skytte1';
var TS={1:{d:[3,2.5,2,1.7,1.5],25:[3,2.5,2.2,2],50:[3,2.5,2,1.7]},2:{d:[4,3.5,3,2.5,2],25:[4,3.5,3],50:[5,4,3.5,3]}};
var TEST={3:[6,9],7:[6,9],15:[8,9],25:[10,8],50:[12,7]};
var MAXR={25:9,50:7};
var tab='h',cur=null,shots=[],msg='',S=load(),activeTrackId='support',statusSupport='support',testSupport='support';
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.pistols)return s;if(s&&s.cells)return{pistols:[{id:1,name:'Pistol 1',on:1,cells:s.cells,log:s.log||[],tests:s.tests||[]}]}}catch(e){}return{pistols:[{id:1,name:'Pistol 1',on:1,cells:{},log:[],tests:[]}]}}
function ensureTracks(p){if(!p.tracks)p.tracks={support:{cells:p.cells||{},log:p.log||[],tests:p.tests||[]},unsupported:{cells:{},log:[],tests:[]}};['support','unsupported'].forEach(function(k){if(!p.tracks[k])p.tracks[k]={cells:{},log:[],tests:[]};if(!p.tracks[k].cells)p.tracks[k].cells={};if(!p.tracks[k].log)p.tracks[k].log=[];if(!p.tracks[k].tests)p.tracks[k].tests=[];if(!p.tracks[k].enabled)p.tracks[k].enabled={};D.forEach(function(d){[1,2].forEach(function(m){var key=m+'-'+d;if(p.tracks[k].enabled[key]===undefined)p.tracks[k].enabled[key]=true})})})}
S.pistols.forEach(ensureTracks);
var cloudUser=null, cloudReady=false, cloudSaving=false;
function setSync(t){var el=document.getElementById('syncstatus');if(el)el.textContent=t}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(cloudUser && cloudReady && window.sb){
    clearTimeout(window.__cloudSaveTimer);
    setSync('Sparar…');
    window.__cloudSaveTimer=setTimeout(async function(){
      if(cloudSaving)return;
      cloudSaving=true;
      try{
        var result=await window.sb.from('skytte_data').upsert(
          {user_id:cloudUser.id,data:S,updated_at:new Date().toISOString()},
          {onConflict:'user_id'}
        );
        if(result.error)throw result.error;
        setSync('Synkat ✓');
      }catch(e){setSync('Molnsynk misslyckades – lokal kopia finns kvar');console.error(e)}
      finally{cloudSaving=false}
    },350);
  }
}
function steps(m,d){var ts=TS[m][d]||TS[m].d,mx=MAXR[d]||10,s=[];ts.forEach(function(t){for(var r=7;r<=mx;r++)s.push([t,r])});return s}
var pid=S.pistols[0].id;
function P(){for(var i=0;i<S.pistols.length;i++)if(S.pistols[i].id==pid)return S.pistols[i];pid=S.pistols[0].id;return S.pistols[0]}
function T(){ensureTracks(P());return P().tracks[activeTrackId]}
function cell(m,d){var C=T().cells,k=m+'-'+d;if(!C[k])C[k]={i:0,m:0,rec:0};return C[k]}
function preset(p){var old=activeTrackId;['support','unsupported'].forEach(function(k){activeTrackId=k;D.forEach(function(d){[1,2].forEach(function(m){var st=steps(m,d),mx=MAXR[d]||10,nr=mx-6,ti=p,rq=p;if(d>=25)ti=Math.max(0,p-1);var i=Math.min(st.length-1,ti*nr+Math.min(rq,nr-1));var c=cell(m,d);c.i=i;c.m=0;c.rec=Math.max(c.rec,0)})})});activeTrackId=old;save()}
S.pistols.forEach(function(p){if(!Object.keys(p.cells).length){pid=p.id;preset(1)}});pid=S.pistols[0].id;
function val(z){return z=='Bom'?0:z=='X'?10:+z}
function pick(keep){
 if(!keep){var pool=S.pistols.filter(function(p){return p.on!==0});if(!pool.length)pool=S.pistols;
  var pw=pool.map(function(p){return ['support','unsupported'].reduce(function(total,k){ensureTracks(p);return total+D.reduce(function(a,d){return a+[1,2].reduce(function(b,m){var en=p.tracks[k].enabled[m+'-'+d]!==false;return b+(en?Math.max(0,steps(m,d).length-p.tracks[k].cells[m+'-'+d]?.i||0):0)},0)},0)},0)});
  if(pw.every(function(x){return x===0})){alert('Slå på minst en nivå under Status för att kunna slumpa serier.');cur=null;return}
  var totalP=pw.reduce(function(a,b){return a+b},0),rp=Math.random()*totalP,j=0;while(j<pool.length-1&&rp>pw[j]){rp-=pw[j];j++}pid=pool[j].id}
 var tracks=['support','unsupported'].filter(function(k){return D.some(function(d){return [1,2].some(function(m){return P().tracks[k].enabled[m+'-'+d]!==false})})});
 if(!tracks.length){alert('Slå på minst en nivå under Status för att kunna slumpa serier.');cur=null;return}
 activeTrackId=tracks[Math.floor(Math.random()*tracks.length)];
 var choices=[];D.forEach(function(d){[1,2].forEach(function(m){if(T().enabled[m+'-'+d]!==false){var c=cell(m,d);choices.push({d:d,m:m,w:Math.max(1,steps(m,d).length-c.i)})}})});
 var total=choices.reduce(function(a,x){return a+x.w},0),r=Math.random()*total,chosen=choices[choices.length-1];
 for(var i=0;i<choices.length;i++){r-=choices[i].w;if(r<0){chosen=choices[i];break}}
 cur={d:chosen.d,m:chosen.m,support:activeTrackId};shots=[];
}
function info(){activeTrackId=cur.support||'support';var st=steps(cur.m,cur.d),c=cell(cur.m,cur.d);return{st:st,c:c,t:st[c.i][0],r:st[c.i][1],n:cur.m==1?5:6}}
function done(){var I=info();shots=shots.slice();for(var i=0;i<I.n;i++)if(!shots[i])return false;return true}
function submit(){
 var I=info(),c=I.c,miss=0,pts=0,x=0;
 shots.forEach(function(z){if(val(z)<I.r)miss++;pts+=val(z);if(z=='X')x++});
 var dl=miss==0?1:miss==1?0:-1,note='',oi=c.i,orec=c.rec,same=T().log.filter(function(e){return e.d==cur.d&&e.m==cur.m}),first=!T().log.length,st5=0;for(var q=same.length-1;q>=0&&same[q].miss==0;q--)st5++;var low=(I.n-miss)/I.n<.7&&same.length>=2&&same.slice(-2).every(function(e){return (I.n-e.miss)/I.n<.7});
 c.m+=dl;
 if(c.m>=2){if(c.i<I.st.length-1){c.i++;note='up'}else note='top';c.m=0}
 else if(c.m<=-2){if(c.i>0){c.i--;c.m=1;note='down'}else c.m=0}
 c.rec=Math.max(c.rec,c.i);
 T().log.push({t:Date.now(),d:cur.d,m:cur.m,tm:I.t,r:I.r,shots:shots,miss:miss,pts:pts,x:x,support:cur.support});
 save();var pn=esc(P().name),trackName=cur.support=='support'?'Med stödhand':'Utan stödhand',ns=I.st[c.i],nl=ns[0]+' s, krav '+(cur.d==50?'7:an':ns[1]+'+'),M,xs=[];
 if(note=='up'){M=c.i>orec?['good','Nytt rekord!','Grattis, utmärkt skjutet. Du är nu på din högsta nivå hittills: '+nl+'.']:['good','Du avancerar!','Bra jobbat, två rena serier. Nu '+nl+'.'];M[2]+=ns[0]!=I.st[oi][0]?' Kravet går tillbaka till 7:an, så du tränar farten först.':' Samma tid, högre krav.'}
 else if(note=='top')M=['good','Toppen klarad!','Mycket bra. Du har klarat högsta nivån på '+cur.d+' yd, '+cur.m+' skott med '+pn+'. Avståndet dyker nu upp som underhåll.'];
 else if(note=='down')M=['bad','Ner ett steg.','Nu '+nl+'. Du landar på +1, och en ren serie tar dig tillbaka.'];
 else if(dl==1)M=['good','Ren serie!','Bra skjutet, +1. En till så går du upp.'];
 else if(dl==0)M=['mid','Ett miss.','Mätaren står kvar på '+sg(c.m)+'.'];
 else M=['mid','Två eller fler miss.','Mätaren '+sg(c.m)+'. Ner vid −2.'];
 if(miss==0&&shots.every(function(z){return z=='X'}))xs.push('Hela serien i innertian.');
 if(miss==0&&(st5+1)%5==0)xs.push('Fem rena serier i rad på rutan. Det här sitter.');
 if(first)xs.push('Första serien med '+pn+' är loggad.');
 if(low)xs.push('Tre serier i rad under 70 %. Överväg att sänka ett steg under Status.');
 msg={c:M[0],t:M[1],l:M[2],x:xs,m:c.m,s:pn+' · '+trackName+' · '+cur.d+' yd, '+cur.m+' skott: '+(I.n-miss)+'/'+I.n+' inom kravet, '+x+' X, '+pts+' poäng'};pick();render()}
function lbl(m,d,i){var st=steps(m,d),s=st[i];return s[0]+' s, ≥'+s[1]}
function render(){
 var h='';
 if(tab!='h'&&tab!='s')h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">'+S.pistols.map(function(p){return '<button class="btn" style="'+(p.id==pid?'background:var(--ac);color:var(--on);border-color:var(--ac)':'')+'" onclick="selp('+p.id+')">'+esc(p.name)+'</button>'}).join('')+'</div>';
 if(tab=='h'){
  h+='<div class="card" style="padding:20px 16px"><div style="font:700 42px/1 Barlow Condensed,sans-serif;color:var(--ac);margin-bottom:8px">SNABBSKYTTE</div><div style="font:700 25px/1.1 Barlow Condensed,sans-serif;margin-bottom:12px">Träna smartare. Skjut snabbare. Träffa bättre.</div><p>Snabbskytte är ett träningsverktyg för dig som vill utveckla snabbhet, precision och jämnhet i pistolskyttet – med särskilt fokus på milsnabb och fältskytte.</p><p>Övningarna simulerar olika skjutmoment genom att variera:</p><ul style="padding-left:21px"><li><b>Avstånd</b> – träna på mål på olika avstånd.</li><li><b>Tid</b> – utmana dig att genomföra momenten snabbare.</li><li><b>Målstorlek och träffkrav</b> – träna precision mot olika stora träffytor och krav.</li></ul><p>Målet är att skjuta snabbare utan att tappa kontroll eller precision. Genom återkommande serier, tester och uppföljning kan du följa utvecklingen och se vad du behöver träna mer på.</p><p>Du kan träna både <b>med stödhand och utan stödhand</b>, med separat progression och historik för respektive träningssätt.</p><button class="go" onclick="tab=\'t\';cur=null;msg=\'\';render()">BÖRJA TRÄNA</button></div><div class="card"><h2>Så använder du appen</h2><p><b>Träna</b> – genomför slumpade serier och registrera dina träffar.</p><p><b>Status</b> – följ nivåer, mätare och personliga rekord.</p><p><b>Test</b> – gör ett fristående 6-skottstest och följ resultaten över tid.</p><p><b>Data</b> – hantera pistoler och säkerhetskopiera dina resultat.</p></div>';
 }
 if(tab=='t'){
  if(!cur)pick();var I=info();
  if(msg)h+=mh(msg);
  h+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:9px"><div style="display:flex;align-items:baseline;gap:7px;color:var(--ac);line-height:1"><span style="font:700 38px/1 Barlow Condensed,sans-serif">'+(cur.support=='support'?'MED':'UTAN')+'</span><span style="font:600 16px/1.2 Barlow Condensed,sans-serif;letter-spacing:1px">STÖDHAND</span></div><button class="btn" style="margin:0;white-space:nowrap;font-size:14px;padding:8px 10px" onclick="pick();msg=\'\';render()">Slumpa serie</button></div><div class="mu">'+esc(P().name)+' · '+(cur.m==1?'1 skott, 5 repetitioner':'2 skott (par), 3 par')+'</div><div class="big">'+cur.d+' <small>yd</small></div>'+
  '<div class="big" style="font-size:34px;margin-top:6px">'+I.t+' s <small>'+(cur.m==2?'per par':'per skott')+'</small> · krav '+(cur.d==50?'7:an':I.r+(I.r<10?'+':''))+'</div>'+
  '<div class="mu" style="margin-top:6px">Steg '+(I.c.i+1)+'/'+I.st.length+' · mätare '+(I.c.m>0?'+':'')+I.c.m+' (upp vid +2) · rekord steg '+(I.c.rec+1)+'</div>'+
  '<div class="mu">Start från 45 grader. Skott utanför tiden anges som Bom.</div></div><div class="card">';
  for(var i=0;i<I.n;i++){h+='<div class="row"><b>'+(i+1)+'</b>'+Z.map(function(z){return '<button class="'+(shots[i]==z?'s'+(z=='Bom'?' bom':''):'')+'" onclick="shot('+i+',\''+z+'\')">'+z+'</button>'}).join('')+'</div>'}
  h+='<button class="go" '+(done()?'':'disabled')+' onclick="submit()">Spara serie</button></div>';
  var L=T().log.slice(-6).reverse();
  if(L.length){h+='<div class="card"><h2>Senaste serier</h2><table>'+L.map(function(e){return '<tr><td>'+e.d+' yd · '+e.m+'sk</td><td>'+e.shots.join(' ')+'</td><td class="r">'+e.pts+'p</td></tr>'}).join('')+'</table></div>'}
 }
 if(tab=='s'){
  activeTrackId=statusSupport;
  h+='<div class="card"><h2>Pistoler</h2><div style="display:flex;flex-wrap:wrap;gap:9px 12px">'+S.pistols.map(function(p){return '<div style="display:flex;flex-direction:column;align-items:center;min-width:72px"><button class="btn" style="margin:0;width:100%;'+(p.id==pid?'background:var(--ac);color:var(--on);border-color:var(--ac)':'')+'" onclick="selp('+p.id+')">'+esc(p.name)+'</button><button class="level-toggle '+(p.on===0?'off':'')+'" style="margin-top:4px" onclick="tg('+p.id+')">'+(p.on===0?'AV':'PÅ')+'</button></div>'}).join('')+'</div></div>';
  h+='<div class="card"><h2>Nivå per avstånd</h2><div class="row"><button class="'+(statusSupport=='support'?'s':'')+'" onclick="statusSupport=\'support\';activeTrackId=statusSupport;render()">Med stödhand</button><button class="'+(statusSupport=='unsupported'?'s':'')+'" onclick="statusSupport=\'unsupported\';activeTrackId=statusSupport;render()">Utan stödhand</button></div><div class="mu">Aktuellt steg · mätare · rekord</div><table><tr><th>yd</th><th>1 skott</th><th>2 skott</th></tr>';
  D.forEach(function(d){h+='<tr><td><b>'+d+'</b></td>'+[1,2].map(function(m){var c=cell(m,d),on=T().enabled[m+'-'+d]!==false;return '<td><div>'+lbl(m,d,c.i)+'</div><span class="mu">'+(c.m>0?'+':'')+c.m+' · rek '+lbl(m,d,c.rec)+'</span><br><button class="level-toggle" onclick="toggleLevel('+m+','+d+')">'+(on?'PÅ':'AV')+'</button></td>'}).join('')+'</tr>'});
  h+='</table></div><div class="card"><h2>Justera steg</h2><div class="mu">Flytta en ruta manuellt.</div>';
  D.forEach(function(d){[1,2].forEach(function(m){h+='<div class="row"><b style="width:70px">'+d+' yd '+m+'sk</b><button onclick="mv('+m+','+d+',-1)">−</button><button style="flex:3" disabled>'+lbl(m,d,cell(m,d).i)+'</button><button onclick="mv('+m+','+d+',1)">+</button></div>'})});
  h+='</div>';
 }
 if(tab=='x'){
  h+='<div class="card"><h2>6-skottstest</h2><div class="mu">Fast tid och krav. Påverkar inte stegen.</div><div class="row"><button class="'+(testSupport=='support'?'s':'')+'" onclick="testSupport=\'support\';shots6=[];render()">Med stödhand</button><button class="'+(testSupport=='unsupported'?'s':'')+'" onclick="testSupport=\'unsupported\';shots6=[];render()">Utan stödhand</button></div><select id="td" onchange="tsel=+this.value;shots6=[];render()">'+D.map(function(d){return '<option value="'+d+'"'+(d==tsel?' selected':'')+'>'+d+' yd: '+TEST[d][0]+' s, krav '+(d==50?'7:an':TEST[d][1]+'+')+'</option>'}).join('')+'</select>';
  for(var i=0;i<6;i++){h+='<div class="row"><b>'+(i+1)+'</b>'+Z.map(function(z){return '<button class="'+(shots6[i]==z?'s'+(z=='Bom'?' bom':''):'')+'" onclick="shots6['+i+']=\''+z+'\';render()">'+z+'</button>'}).join('')+'</div>'}
  h+='<input id="tt" type="number" step="0.1" placeholder="Sluttid i sekunder" style="margin-top:8px"><button class="go" onclick="saveTest()">Spara test</button></div>';
  if(P().tracks[testSupport].tests.length)h+='<div class="card"><h2>Testhistorik · '+(testSupport=='support'?'Med stödhand':'Utan stödhand')+'</h2><table><tr><th>Datum</th><th>yd</th><th>Poäng</th><th>Träff</th><th>X</th><th>Tid</th></tr>'+P().tracks[testSupport].tests.slice().reverse().map(function(e){return '<tr><td>'+new Date(e.t).toLocaleDateString('sv-SE')+'</td><td>'+e.d+'</td><td>'+e.pts+'/60</td><td>'+e.hit+'/6</td><td>'+e.x+'</td><td>'+(e.time||'–')+'</td></tr>'}).join('')+'</table></div>';
 }
 if(tab=='d'){

async function authAction(mode){
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  var out=document.getElementById('authmsg');
  if(!email||!password){out.textContent='Ange e-post och lösenord.';return}
  if(password.length<8){out.textContent='Lösenordet måste vara minst 8 tecken.';return}
  out.textContent='Arbetar…';
  try{
    var r=mode==='signup'
      ? await window.sb.auth.signUp({email:email,password:password})
      : await window.sb.auth.signInWithPassword({email:email,password:password});
    if(r.error)throw r.error;
    if(mode==='signup'&&!r.data.session){
      out.textContent='Kontot är skapat. Bekräfta din e-post via länken som skickats och logga sedan in.';
      return;
    }
    await startCloud(r.data.user);
  }catch(e){out.textContent=e.message||'Inloggningen misslyckades.'}
}

    if(r.data && r.data.data && r.data.data.pistols){
